# fly.toml app configuration file generated for codesigning on 2026-07-15T13:28:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'codesigning'
primary_region = 'ams'

[build]

[deploy]
  # Runs before each new version takes traffic: apply migrations, then seed
  # roles + the initial admin (idempotent). Requires DATABASE_URL, DIRECT_URL
  # and SEED_ADMIN_* to be set as secrets.
  release_command = 'npm run db:release'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
