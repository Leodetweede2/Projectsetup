<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <rect width="1000" height="700" fill="#f8fafc"/>
  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#334155" stroke-width="6"/>
  <!-- corridor -->
  <rect x="270" y="20" width="120" height="660" fill="#e2e8f0"/>
  <text x="330" y="360" fill="#64748b" font-family="sans-serif" font-size="18" text-anchor="middle" transform="rotate(-90 330 360)">Corridor</text>

  <!-- Room H1.001 -->
  <rect x="50" y="50" width="200" height="200" fill="#dbeafe" stroke="#334155" stroke-width="3"/>
  <text x="150" y="145" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">H1.001</text>
  <text x="150" y="170" fill="#475569" font-family="sans-serif" font-size="14" text-anchor="middle">Radiologie</text>

  <!-- Room H1.002 -->
  <rect x="410" y="50" width="540" height="200" fill="#dcfce7" stroke="#334155" stroke-width="3"/>
  <text x="680" y="145" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">H1.002</text>
  <text x="680" y="170" fill="#475569" font-family="sans-serif" font-size="14" text-anchor="middle">Cardiologie</text>

  <!-- Room H1.003 -->
  <rect x="50" y="450" width="200" height="200" fill="#fef9c3" stroke="#334155" stroke-width="3"/>
  <text x="150" y="545" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">H1.003</text>
  <text x="150" y="570" fill="#475569" font-family="sans-serif" font-size="14" text-anchor="middle">Servicedesk</text>

  <!-- Room H1.004 -->
  <rect x="410" y="450" width="540" height="200" fill="#fae8ff" stroke="#334155" stroke-width="3"/>
  <text x="680" y="545" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">H1.004</text>
  <text x="680" y="570" fill="#475569" font-family="sans-serif" font-size="14" text-anchor="middle">Longafdeling</text>
</svg>
